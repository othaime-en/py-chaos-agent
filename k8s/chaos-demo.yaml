apiVersion: v1
kind: Namespace
metadata:
  name: chaos-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-config
  namespace: chaos-demo
data:
  config.yaml: |
    agent:
      interval_seconds: 15
      dry_run: false
      # The demo's purpose is to inject chaos, so start as soon as the API is up.
      # Without this, nothing happens until POST /agent/start.
      auto_start: true

    # Injections are held to a fraction of the chaos-agent container's own
    # CPU and memory limits (see resources: below). require_cgroup_limits makes
    # the agent refuse CPU/memory injections if those limits are ever removed.
    safety:
      cpu_fraction: 0.8
      memory_fraction: 0.5
      require_cgroup_limits: true

    # Pause chaos when the target's /health stops answering, and resume it by
    # itself once the target has recovered. The sidecar shares the pod network,
    # so localhost reaches the target container.
    kill_switch:
      enabled: true
      target_health_url: "http://localhost:8080/health"
      health_check_interval_seconds: 10
      consecutive_failures_threshold: 3
      resume_after_recovery: true

    failures:
      cpu:
        enabled: true
        duration_seconds: 8
        probability: 0.4
        cores: 1

      memory:
        enabled: false
        duration_seconds: 10
        probability: 0.2
        mb: 150

      process:
        enabled: true
        target_name: "target-app"
        probability: 0.5

      network:
        enabled: true
        interface: "eth0"
        delay_ms: 500
        duration_seconds: 12
        probability: 0.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-app
  namespace: chaos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resilient-app
  template:
    metadata:
      labels:
        app: resilient-app
    spec:
      shareProcessNamespace: true
      # Pod-wide defaults. Both containers run as unprivileged users (the images
      # set UIDs 10002 and 10001); runAsNonRoot makes the kubelet refuse to start
      # a container that would run as root.
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: target-app
          # Pinned tag, never :latest. Build it with:
          #   docker build -t target-app:1.0.0 -f docker/Dockerfile.target .
          image: target-app:1.0.0
          imagePullPolicy: Never
          securityContext:
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        - name: chaos-agent
          # Pinned tag, never :latest. Build it with:
          #   docker build -t py-chaos-agent:1.0.0 -f docker/Dockerfile .
          image: py-chaos-agent:1.0.0
          imagePullPolicy: Never
          # These limits are the blast-radius boundary for CPU and memory
          # injections: the kernel enforces them, and the agent sizes its
          # injections to a fraction of them (config: safety). Without them a
          # CPU or memory injection would compete with every pod on the node.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: logs
              mountPath: /var/log/chaos-agent
            # The root filesystem is read-only; /tmp is the only other place
            # the agent may write.
            - name: tmp
              mountPath: /tmp
            - name: api-token
              mountPath: /var/run/secrets/chaos-api
              readOnly: true
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            # The image gives these two to its interpreter as file capabilities
            # (see docker/Dockerfile). They must be granted here too: that is
            # what allows them. Without them the container will not start.
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN # tc netem latency injection
                - KILL # signal the target container's process
          ports:
            - containerPort: 8000 # metrics
              name: metrics
            - containerPort: 9000 # api
              name: api
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_FORMAT
              value: json
            - name: LOG_FILE
              value: "/var/log/chaos-agent/agent.log"
            # Probes reach the API on the pod IP, so it must listen beyond
            # loopback. This is safe only because a token is mandatory: the
            # server refuses to start without one.
            - name: CHAOS_API_HOST
              value: "0.0.0.0"
            - name: CHAOS_API_TOKEN_FILE
              value: /var/run/secrets/chaos-api/token
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: chaos-config
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # Create before applying (pod will not start without it):
        #   kubectl -n chaos-demo create secret generic chaos-api-token \
        #     --from-literal=token="$(openssl rand -hex 32)"
        - name: api-token
          secret:
            secretName: chaos-api-token
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: resilient-app
  namespace: chaos-demo
spec:
  selector:
    app: resilient-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-agent-api
  namespace: chaos-demo
spec:
  selector:
    app: resilient-app
  # The control API (9000) is intentionally not exposed through this Service.
  # Reach it with: kubectl -n chaos-demo port-forward deploy/resilient-app 9000:9000
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# Network policy. Everything is denied, then only what the demo needs is allowed.
# The control API (9000) is not reachable from other pods; use port-forward.
# Kubelet probes and `kubectl port-forward` are not filtered by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: chaos-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilient-app
  namespace: chaos-demo
spec:
  podSelector:
    matchLabels:
      app: resilient-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The target app, for other pods in this namespace.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus metrics, from a namespace named "monitoring".
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS only. The agent talks to the target over localhost (same pod), and
    # neither container needs anything else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
