apiVersion: v1
kind: Namespace
metadata:
  name: chaos-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-config
  namespace: chaos-demo
data:
  config.yaml: |
    agent:
      interval_seconds: 15
      dry_run: false

    # Injections are held to a fraction of the chaos-agent container's own
    # CPU and memory limits (see resources: below). require_cgroup_limits makes
    # the agent refuse CPU/memory injections if those limits are ever removed.
    safety:
      cpu_fraction: 0.8
      memory_fraction: 0.5
      require_cgroup_limits: true

    failures:
      cpu:
        enabled: true
        duration_seconds: 8
        probability: 0.4
        cores: 1

      memory:
        enabled: false
        duration_seconds: 10
        probability: 0.2
        mb: 150

      process:
        enabled: true
        target_name: "target-app"
        probability: 0.5

      network:
        enabled: true
        interface: "eth0"
        delay_ms: 500
        duration_seconds: 12
        probability: 0.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-app
  namespace: chaos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resilient-app
  template:
    metadata:
      labels:
        app: resilient-app
    spec:
      shareProcessNamespace: true
      containers:
        - name: target-app
          image: target-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        - name: chaos-agent
          image: py-chaos-agent:latest
          imagePullPolicy: Never
          # These limits are the blast-radius boundary for CPU and memory
          # injections: the kernel enforces them, and the agent sizes its
          # injections to a fraction of them (config: safety). Without them a
          # CPU or memory injection would compete with every pod on the node.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: logs
              mountPath: /var/log/chaos-agent
            - name: api-token
              mountPath: /var/run/secrets/chaos-api
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN # tc netem latency injection
                - KILL # signal the target container's process
          ports:
            - containerPort: 8000 # metrics
              name: metrics
            - containerPort: 9000 # api
              name: api
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: JSON_LOGS
              value: "true"
            - name: LOG_FILE
              value: "/var/log/chaos-agent/agent.log"
            # Probes reach the API on the pod IP, so it must listen beyond
            # loopback. This is safe only because a token is mandatory: the
            # server refuses to start without one.
            - name: CHAOS_API_HOST
              value: "0.0.0.0"
            - name: CHAOS_API_TOKEN_FILE
              value: /var/run/secrets/chaos-api/token
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: chaos-config
        - name: logs
          emptyDir: {}
        # Create before applying (pod will not start without it):
        #   kubectl -n chaos-demo create secret generic chaos-api-token \
        #     --from-literal=token="$(openssl rand -hex 32)"
        - name: api-token
          secret:
            secretName: chaos-api-token
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: resilient-app
  namespace: chaos-demo
spec:
  selector:
    app: resilient-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-agent-api
  namespace: chaos-demo
spec:
  selector:
    app: resilient-app
  # The control API (9000) is intentionally not exposed through this Service.
  # Reach it with: kubectl -n chaos-demo port-forward deploy/resilient-app 9000:9000
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP