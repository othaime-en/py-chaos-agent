services:
  target-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.target
    ports:
      # Host-side bindings are loopback only. The chaos agent shares this
      # container's network namespace, so its ports are published here.
      - "8080:8080"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
    restart: always
    # Run under an init (tini). Without it the app is PID 1 of the namespace the
    # chaos agent shares, and PID 1 cannot be killed from inside that namespace
    # (the kernel discards the signal), so the process failure would be refused.
    # With it, tini is PID 1 and the app is PID 2.
    init: true
    cpus: 1.0
    mem_limit: 256m
    # The image runs as an unprivileged user (UID 10002). It needs nothing else.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  chaos-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: "service:target-app"
    pid: "service:target-app"
    # When the target's init exits (for example after a process kill), the kernel
    # tears down the shared PID namespace and kills everything in it, including
    # this agent. Restart it along with the target.
    restart: always
    # Least privilege: no `privileged: true`, and the image runs as an
    # unprivileged user (UID 10001). NET_ADMIN is needed for `tc` latency
    # injection, KILL for signalling the target process (a different user).
    # The image hands exactly those two to its interpreter as file capabilities;
    # the cap_add below is what allows it. Remove either and the container
    # refuses to start ("operation not permitted").
    read_only: true
    tmpfs:
      - /tmp
    # Resource limits are the blast-radius boundary for CPU and memory
    # injections. The agent sizes injections to a fraction of these
    # (config.yaml: safety). pids_limit stops a runaway fork.
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - KILL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Named volume: with all other capabilities dropped, root can no longer
      # write into a host directory owned by another user.
      - chaos-logs:/var/log/chaos-agent
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LOG_FILE=/var/log/chaos-agent/agent.log
      # Reachable through the published (loopback-only) host port above.
      - CHAOS_API_HOST=0.0.0.0
      # Required. Compose refuses to start without it. See .env.example.
      - CHAOS_API_TOKEN=${CHAOS_API_TOKEN:?Set CHAOS_API_TOKEN, e.g. openssl rand -hex 32}
    healthcheck:
      # The image has Python but not curl. urlopen raises on a connection error
      # or any non-2xx response, which makes the check exit non-zero.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chaos-logs:
