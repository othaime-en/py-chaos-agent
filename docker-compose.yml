services:
  target-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.target
    ports:
      - "8080:8080"
    restart: always

  chaos-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    privileged: true
    network_mode: "service:target-app"
    pid: "service:target-app"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/var/log/chaos-agent
    ports:
      - "8000:8000" # Metrics
      - "9000:9000" # API
    environment:
      - LOG_LEVEL=INFO
      - JSON_LOGS=true
      - LOG_FILE=/var/log/chaos-agent/agent.log
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
