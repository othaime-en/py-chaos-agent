# Py-Chaos-Agent Configuration
# This file controls all aspects of the chaos agent behavior

# Agent configuration
agent:
  # How often to check and potentially inject failures (in seconds)
  interval_seconds: 10
  
  # Dry run mode - if true, logs what would happen without actually doing it
  dry_run: false

# Logging configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # DEBUG - Very verbose, shows all operations (use in development)
  # INFO - Standard operational logging (recommended for production)
  # WARNING - Only important non-error events
  # ERROR - Only errors and critical issues
  level: INFO
  
  # Log format: 'text' (human-readable) or 'json' (structured, for log aggregators)
  # Use 'text' for development/debugging
  # Use 'json' for production with ELK, Splunk, etc.
  format: text
  
  # Console logging (stdout/stderr)
  console:
    enabled: true
  
  # File logging with automatic rotation
  file:
    enabled: true
    
    # Path to log file
    # For containers: /var/log/chaos-agent/agent.log
    # For local dev: ./logs/agent.log
    path: ./logs/agent.log
    
    # Maximum size of each log file before rotation (in MB)
    max_size_mb: 10
    
    # Number of rotated backup files to keep
    backup_count: 5


# Kill switch configuration
kill_switch:
  # Automatically pause chaos when the target becomes unhealthy, and resume it
  # once the target has recovered. Applies to the agent loop, the standalone
  # agent, and POST /inject/manual. Settings here can only be changed in this
  # file, never through the API.
  enabled: true

  # Target application health endpoint. Any 2xx response is healthy; a timeout,
  # connection error, or any other status counts as a failure. Adjust for your
  # setup (in Kubernetes the sidecar shares the pod network, so localhost works).
  target_health_url: "http://localhost:8080/health"
  health_check_interval_seconds: 10
  health_check_timeout_seconds: 2     # must not exceed the interval

  # Trip after this many failed checks in a row
  consecutive_failures_threshold: 3

  # Grace periods (seconds). A process kill takes the target down on purpose, so
  # health checks are skipped after one. The start grace applies each time chaos
  # becomes active, so a target that is still booting does not trip the switch.
  grace_after_process_kill_seconds: 60
  grace_after_agent_start_seconds: 30

  # Recovery: after a trip, wait, then require this many healthy checks in a row.
  # One failed check while testing sends it back to waiting.
  recovery_test_interval_seconds: 120
  recovery_success_threshold: 3

  # true: chaos resumes by itself after recovery.
  # false: chaos stays off after a trip until an operator calls
  #        POST /kill-switch/reset (a standalone agent must be restarted).
  resume_after_recovery: true

  # false: the API cannot turn the kill switch off (POST /agent/start with
  # enable_kill_switch=false is refused).
  allow_api_disable: false

# Safety budget for CPU and memory injections
#
# The agent reads this container's cgroup limits (Docker --cpus/--memory,
# Kubernetes resources.limits) and sizes injections to a fraction of them.
# CPU requests above the budget are clamped; memory requests above it are
# refused. These settings can only be changed here, never through the API.
safety:
  # Share of the container's CPU limit that injections may use (0.1 to 0.9)
  cpu_fraction: 0.8

  # Share of the container's free memory that injections may use (0.1 to 0.8)
  memory_fraction: 0.5

  # If true, refuse CPU/memory injections when the container has no limit set.
  # Recommended in Kubernetes and any shared environment. Leave false for
  # local development without limits (the agent then bounds itself by host
  # CPU count and available memory only).
  require_cgroup_limits: false

# Failure injection configurations
failures:
  # CPU stress injection
  cpu:
    enabled: true
    probability: 0.3  # 30% chance each interval
    cores: 2          # Number of CPU cores to stress
    duration_seconds: 5

  # Memory pressure injection
  memory:
    enabled: true
    probability: 0.2  # 20% chance each interval
    mb: 100           # Amount of memory to allocate (in MB)
    duration_seconds: 10

  # Process kill injection
  process:
    enabled: false    # Disabled by default (dangerous!)
    probability: 0.1  # 10% chance each interval
    # Kills exactly ONE process. The name must match EXACTLY (case-insensitive):
    # the process name, the executable, or for `python app.py` / `java -jar
    # app.jar` the script or jar name. It is never a substring and never matches
    # command-line arguments, so "target-app" does not match `tail -f target-app.log`.
    target_name: "target-app"
    # When several processes match: "oldest" (default; usually the parent or
    # master) or "newest" (usually the latest worker).
    target_selection: oldest
    # target_pid: 1234   # optional: one exact PID (mostly for manual injections)

  # Network latency injection
  network:
    enabled: true
    probability: 0.25  # 25% chance each interval
    interface: "eth0"  # Network interface to affect
    delay_ms: 100      # Latency to add (in milliseconds)
    duration_seconds: 15

