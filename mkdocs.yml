site_name: kaos Documentation
site_description: A Python-based chaos engineering sidecar tool for testing containerized applications
site_author: othaime-en
site_url: https://othaime-en.github.io/kaos/

repo_name: othaime-en/kaos
repo_url: https://github.com/othaime-en/kaos
edit_uri: edit/main/docs/

theme:
  name: shadcn
  palette:
    scheme: slate
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

validation:
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  # codehilite makes the shadcn theme load its Pygments stylesheets.
  # pymdownx.highlight renders the fenced blocks; css_class must be
  # "codehilite" so the theme's copy button and colours attach to them.
  - codehilite:
      guess_lang: false
  - pymdownx.highlight:
      css_class: codehilite
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Architecture: user-guide/architecture.md
      - Monitoring: user-guide/monitoring.md
      - Kubernetes Deployment: user-guide/kubernetes.md
      - Terraform (AWS EKS): user-guide/terraform.md
      - API Security: user-guide/api-security.md
      - Blast Radius: user-guide/blast-radius.md
      - Experiments: user-guide/experiments.md
      - Process Targeting: user-guide/process-targeting.md
      - Kill Switch: user-guide/kill-switch.md
      - Shutdown and Cleanup: user-guide/shutdown-and-cleanup.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Development:
      - Contributing: development/development.md
  - API Reference: reference/api.md
  - Safety & Ethics: safety.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/othaime-en/kaos
